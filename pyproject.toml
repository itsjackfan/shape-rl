[project]
name = "shape-rl"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision",
    "pillow",
    "transformers>=4.57",
    "trl==1.17.1",
    "datasets>=3.0",
    "accelerate>=1.4",
    "hydra-core>=1.3",
    "wandb>=0.19",
    "lm_eval==0.4.13",
    "math-verify[antlr4_9_3]>=0.7",
    "einops>=0.8",
]

[project.optional-dependencies]
cluster = ["vllm", "deepspeed"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shape_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a tiny HF model and runs real train steps"]
