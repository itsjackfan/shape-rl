# C0: label-free trajectory InfoNCE (positive = next on-trace state of the same trace, negatives = other prompts); linear readout on z.
kind: contrastive
loss: trajectory
proj: {hidden: 512, dim: 128, lr: 1.0e-3, weight_decay: 1.0e-4, steps: 1500, batch: 512, tau: 0.1}  # z = g(h)
head: {lr: 1.0e-3, weight_decay: 1.0e-2, batch: 4096, max_epochs: 50, patience: 3}  # readout / regression head, early stop on val BCE
