defaults:
  - base
  - model: qwen3.6-27b
  - objective: grpo
  - data/train: [gsm8k, math]
  - _self_

# Passed verbatim to trl.GRPOConfig (merged with objective.trl).
train:
  learning_rate: 1.0e-6
  lr_scheduler_type: constant
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  num_generations: 8
  max_completion_length: 2048
  temperature: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 100
  use_vllm: false
  vllm_mode: colocate
